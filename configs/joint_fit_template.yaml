planet_name: lhs1140b
target_name: lhs1140b

output:
  root_dir: /home/ssalhi/projects/def-lplevass/ssalhi/ROCKY_WORLDS_REPO/lhs1140b/step3/joint_fits/

transit:
  limb_dark: quadratic

submission:
  enabled: false
  target: LHS1140b
  form_path: /path/to/completed/form_LHS1140b.json

  minimum_posterior_samples: 10000
  maximum_posterior_samples: null

# Shared astrophysical parameters: sampled once across all eclipses.
parameters:
  eclipse:
    fp: {type: uniform, initial: 8.5e-5, lower: -0.0002, upper: 0.0002}
    t0_mjd: {type: fixed, value: 58399.43}
    period_days: {type: fixed, value: 24.73723}
    rp: {type: fixed, value: 0.0739}
    a: {type: fixed, value: 95.3}
    inc: {type: fixed, value: 89.86}
    ecc: {type: fixed, value: 0.0}
    w: {type: fixed, value: 90.0}
    u1: {type: fixed, value: 0.16}
    u2: {type: fixed, value: 0.22}

fit:
  # Choose emcee or dynesty. Dynesty returns posterior samples and evidence
  # from the same nested-sampling run.
  sampler: dynesty
  nwalkers: 100
  nsteps: 10000
  burn_in: 2000
  random_seed: 42
  # Global default; an eclipse can override this under its transit block.
  fp_initial: 8.5e-5
  # Backward-compatible simple bounds. These are used unless overridden below.
  fp_bounds: [-0.0002, 0.0002]
  sigma_min: 0.0
  sigma_bounds: [1.0e-8, 0.01]
  priors:
    fp:
      type: uniform
      lower: -0.0002
      upper: 0.0002
  evidence:
    # Used only to request the extra evidence run when sampler is emcee.
    # A dynesty primary fit always computes evidence.
    enabled: true
    nlive: 500
    dlogz: 1
    bound: multi
    sample: rwalk
    progress: true

plots:
  corrected_flux: true
  rednoise: true
  walker: true
  corner: true

  combined_binned_fit: true
  stacked_binned_fit: true

  combined_n_bins: 200
  combined_xlim: [0.475, 0.55]

  stacked_vertical_offset: 0.004
  stacked_n_bins: 200
  stacked_xlim: [0.475, 0.55]

eclipses:
  # Each eclipse may add a sibling `parameters` block with:
  # parameters:
  #   eclipse:
  #     t_secondary_mjd: {type: uniform, initial: ..., lower: ..., upper: ...}
  #   detrending:
  #     linear_slope: {type: gaussian, initial: 0.0, mean: 0.0, sigma: 0.01, lower: -0.1, upper: 0.1}
  #     linear_intercept: {type: fixed, value: 1.0}
  #   noise:
  #     sigma: {type: uniform, initial: 0.001, lower: 1.0e-8, upper: 0.01}

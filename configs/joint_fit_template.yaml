    data:
      path: /home/ssalhi/Rocky-Worlds-public/trimmed_cleaned_data/eclipse1_trimmed_SpecData.h5
    transit:
      t_secondary_mjd: {type: uniform, initial: 61231.935526, lower: 61231.89, upper: 61231.97} # 61231.813
      ecc_prior: {type: uniform, initial: 0.0, lower: 0.0, upper: 0.1}
    detrending:
      model_type: linear
      linear_intercept: {type: uniform, initial: 1.0, lower: 0.8, upper: 1.2}
      linear_slope: {type: uniform, initial: 0.0, lower: -0.1, upper: 0.1}
    preprocessing:
      normalize: median

planet_name: lhs1140b
target_name: lhs1140b
eclipse_number: 4

output:
  root_dir: /home/ssalhi/projects/def-lplevass/ssalhi/ROCKY_WORLDS_REPO/lhs1140b/step2/eclipse4/
  run_label: apt_trimmed_linear

data:
  # Can be a SpecData.h5 file or a directory containing one.
  path: /home/ssalhi/Rocky-Worlds-public/trimmed_cleaned_data/eclipse4_trimmed_SpecData.h5

transit:
  expected_midtime_mjd: 61380.225801 # 61380.257371 
  fixed:
    t0_mjd: 61380.225801 # 61380.257371 
    period_days: 24.7372457
    rp: 0.0739 # in units of stellar radii 
    a: 95.3
    inc: 89.86
    # ecc: 0.0
    w: 90.0
    limb_dark: quadratic
    u: [0.16, 0.22]
  ecc_initial: 0.0
  ecc_prior:
    type: gaussian
    mean: 0.0
    sigma: 0.01
    lower: 0.0
    upper: 0.1

detrending:
  model_type: linear
  # initial_guess: [0.0, 0.0, 1.0, 0.0, 1.0, 0.0, 0.00185751, 3.11482, 0.162559, 0.549587]
  # [0.0, 1.0, 0.0, 0.00198032, 2.97535, 0.0541917, 0.131597, 0.0, 0.00230270, 3.09932, 0.131597, 0.379295]
  # prior_bounds: [[-0.1, 0.1], [-0.1, 0.1], [-5.0, 5.0], [-0.1, 0.1], [0.8, 1.2], [-0.001, 0.001], [0.001, 0.002], [3.0, 4.0], [0.01, 0.3], [0.01, 1.0]]

parameters:
  eclipse:
    # Absolute MJD values in the same time system as the HDF5 `time` dataset.
    t_secondary_mjd: {type: uniform, initial: 61380.225801, lower: 61380.07, upper: 61380.37}
    fp: {type: uniform, initial: 0.000085, lower: -0.0002, upper: 0.0002}
    t0_mjd: {type: fixed, value: 58399.4300}
    period_days: {type: fixed, value: 24.7372457}
    rp: {type: fixed, value: 0.0739}
    a: {type: fixed, value: 95.3}
    inc: {type: fixed, value: 89.86}
    ecc: {type: fixed, value: 0.0}
    w: {type: fixed, value: 90.0}
    u1: {type: fixed, value: 0.16}
    u2: {type: fixed, value: 0.22}
  detrending:
    linear_intercept: {type: uniform, initial: 1.0, lower: 0.8, upper: 1.2}
    linear_slope: {type: uniform, initial: 0.0, lower: -0.1, upper: 0.1}
    # exp_amplitude: {type: uniform, initial: 0.0, lower: -0.1, upper: 0.1}
    # exp_rate: {type: uniform, initial: 0.0, lower: -5.0, upper: 5.0}
    # exp_offset: {type: uniform, initial: 1.0, lower: 0.8, upper: 1.2}

  noise:
    sigma: {type: uniform, initial: 0.001, lower: 1.0e-8, upper: 0.01}

fit:
  nwalkers: 100
  nsteps: 10000
  burn_in: 2000
  random_seed: 42
  # dt_s_initial_hours: 4.577696391264908 # 4.577696391264908
  # fix_mid_eclipse_time: true 
  # fp_initial: 0.000085
  # dt_s_bounds_hours: [-1.075, 1.075]
  # fp_bounds: [-0.0002, 0.0002]
  sigma_min: 0.0
  priors: {}
  sampler: emcee
  evidence:
    enabled: false
    nlive: 5000
    dlogz: 0.01
    bound: multi
    sample: rwalk
    progress: true
    sigma_bounds: [1.0e-8, 0.01]
  # Optional correlated-noise model. When disabled, the original likelihood is used.
  gaussian_process:
    enabled: false
    include_flux_errors: false
    kernels:
      - name: stellar
        kernel: matern32
        log_sigma_initial: -11  # 30 ppm
        log_rho_initial: -0.693     # 0.5 hours
        log_sigma_bounds: [-13.816, -9]
        log_rho_bounds: [-2.303, 0.765]

      # - name: flare
      #   kernel: matern32
      #   log_sigma_initial: -3  # 2000 ppm
      #   log_rho_initial: 1.792      # 6 hours
      #   log_sigma_bounds: [-13.816, -2.69]
      #   log_rho_bounds: [0.765, 3.0]

preprocessing:
  normalize: median
  sigma_clip: 4.0

plots:
  corrected_flux: true
  gaussian_process: true
  rednoise: true
  walker: true
  corner: true
  binned_fit: true
  n_bins: 100

